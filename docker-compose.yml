services:
  app:
    build: .
    image: image-to-csv-cloud:latest
    container_name: image-to-csv-cloud
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=12)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10s
