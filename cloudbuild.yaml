# CI/CD for image-to-csv, run by two Cloud Build triggers in project
# image-to-csv-app (region us-central1), same steps, different service:
#
#   push to dev  -> deploy-staging-on-push-dev -> Cloud Run image-to-csv-staging
#   push to main -> deploy-on-push-main        -> Cloud Run image-to-csv (live)
#
# The staging trigger overrides _SERVICE; everything else is shared, so what
# passes on staging is exactly what ships to live.
#
#   1. preflight  - the same checks as ./deploy.sh (syntax, imports, every client
#                   workbook fills to valid OOXML), on the container's Python
#   1b. recalc    - runs alongside preflight: LibreOffice recalculates a test
#                   export of every client workbook; fails on #NAME?/errors or any
#                   value that differs from Excel 365 (ci/recalc_check.py,
#                   expected values in ci/golden/)
#   2. build      - docker build of the repo's Dockerfile (waits for 1 and 1b)
#   3. push       - to the Artifact Registry repo Cloud Run already uses
#   4. deploy     - new Cloud Run revision from that image
#
# The deploy step passes only --image. Env vars (GEMINI_MODEL, GEMINI_BASE_URL,
# REASONING_EFFORT, ...), memory, concurrency, scaling and the runtime service
# account stay as configured on the service; change those with
# `gcloud run services update` or ./deploy.sh, not here.

substitutions:
  _SERVICE: image-to-csv
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/image-to-csv

steps:
  - id: preflight
    name: python:3.11-slim
    entrypoint: bash
    args: ["-c", "PREFLIGHT_ONLY=1 bash deploy.sh"]

  # Debian's LibreOffice (7.4) has no LET or XLOOKUP, like Excel 2016/2019, so a
  # 365-only function that slips into an export shows up here as #NAME?.
  - id: recalc
    name: debian:bookworm-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui python3 >/dev/null
        python3 ci/recalc_check.py check

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: ["preflight", "recalc"]
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --quiet

  - id: health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_SERVICE} --region ${_REGION} --format='value(status.url)')
        echo "Service: $$URL"
        curl -fsS --max-time 60 "$$URL/api/health"

images:
  - ${_IMAGE}:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
